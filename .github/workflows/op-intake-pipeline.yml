name: OP Intake Pipeline (S0-S4)

# Tracker status, S0 Create intake files, S1 Upload intake files, S2 Upload
# claim memos, S4 Check claims in Core Claims — see README § OP
# Teleconsultation pipeline. S3 is skipped for now (no DE database access;
# SKIPPED_STAGES in src/constants/tracker.config.ts). Run S4 as its own run,
# 15+ min after S2: DE needs that long to process the intake.
#
# Manual trigger only: S1 and S2 upload to the real Azure Blob storage the
# claims pipeline watches, so nothing here runs on a push or a schedule.
on:
  workflow_dispatch:
    inputs:
      create_intake:
        description: 'S0 Create intake files'
        type: boolean
        default: true
      upload_intake:
        description: 'S1 Upload intake files'
        type: boolean
        default: true
      upload_memos:
        description: 'S2 Upload claim memos'
        type: boolean
        default: true
      check_core_claims:
        description: 'S4 Check claims in Core Claims (run alone, 15+ min after S2)'
        type: boolean
        default: false
      payment_mode:
        description: 'Payment mode to generate files for (PAYMENT_MODE_FILTER)'
        type: choice
        default: ALL
        options:
          - ALL
          - DPS
          - COMCHECK
          - UB
      initialize_state:
        description: 'First run on this runner only: create the pipeline state store (README § Pipeline state on the runner)'
        type: boolean
        default: false

# Every pipeline run reads and writes the same tracker and used control numbers
# on the runner (README § Pipeline state on the runner) — two at once would
# overwrite each other. Future S3+ workflows join this same group.
concurrency:
  group: op-pipeline-state
  cancel-in-progress: false

jobs:
  pipeline:
    name: Tracker status, S0-S4
    # AVD-BASCL06-0 only: it holds the pipeline state. Any other runner would
    # start empty and reuse control codes, so the op-pipeline label pins it.
    runs-on: [self-hosted, windows, op-pipeline]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    env:
      # ALL = no filter; an empty value is read as "every mode".
      PAYMENT_MODE_FILTER: ${{ inputs.payment_mode != 'ALL' && inputs.payment_mode || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22.18+ at least: the scripts run .ts files with plain `node`.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The pipeline's state (tracker, intake files, used control numbers) is
      # git-ignored, so checkout's clean deletes it from the workspace on every
      # run; this keeps it on the runner between runs. Refuses to run when the
      # state is missing or damaged — README § Pipeline state on the runner.
      # No browser install: setup/api use channel msedge, the runner's own Edge.
      - name: Restore pipeline state
        id: restore
        uses: ./.github/actions/pipeline-state
        with:
          mode: restore
          initialize: ${{ inputs.initialize_state }}

      - name: Tracker status (before)
        run: |
          $out = node scripts/init-control-code-tracker.ts
          $code = $LASTEXITCODE
          $out | Write-Host
          (@('### Tracker status (before)', '```') + $out + @('```')) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit $code

      - name: S0 Create intake files
        if: ${{ inputs.create_intake }}
        run: node scripts/generate-intake-batches.ts

      # headless is forced on under CI by playwright.config.ts. The `setup`
      # project signs in to Microsoft first (password + generated TOTP).
      - name: S1 Upload intake files
        if: ${{ inputs.upload_intake }}
        run: npx playwright test tests/IntakeUpload.spec.ts
        env:
          # Left side = env var the config reads (do not rename); right side = your GitHub secret.
          BASE_URL: ${{ secrets.BASE_URL }}
          VALID_USERNAME_1: ${{ secrets.JOHN_EMAIL }}
          VALID_PASSWORD_1: ${{ secrets.JOHN_PASSWORD }}
          VALID_OTP_SECRET_1: ${{ secrets.JOHN_OTP_SECRET }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
          # Own folder per step, or S2's report would replace this one.
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/s1-intake-upload

      # Skipped if S1 failed. Only codes whose S1 passed are eligible anyway.
      - name: S2 Upload claim memos
        if: ${{ inputs.upload_memos }}
        run: npx playwright test tests/ClaimMemoUpload.spec.ts
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          VALID_USERNAME_1: ${{ secrets.JOHN_EMAIL }}
          VALID_PASSWORD_1: ${{ secrets.JOHN_PASSWORD }}
          VALID_OTP_SECRET_1: ${{ secrets.JOHN_OTP_SECRET }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/s2-memo-upload

      # Searches each due code in Core Claims → Claims Query (msedge project,
      # signs in through `setup` first). Presence only while S3 is skipped.
      # Too early (DE still processing) = FAILED, which a later run retries.
      - name: S4 Check claims in Core Claims
        if: ${{ inputs.check_core_claims }}
        run: npx playwright test tests/ClaimsQueryCheck.spec.ts
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          VALID_USERNAME_1: ${{ secrets.JOHN_EMAIL }}
          VALID_PASSWORD_1: ${{ secrets.JOHN_PASSWORD }}
          VALID_OTP_SECRET_1: ${{ secrets.JOHN_OTP_SECRET }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/s4-claims-query

      - name: Tracker status (after)
        if: ${{ always() && steps.restore.outcome == 'success' }}
        run: |
          $out = node scripts/init-control-code-tracker.ts
          $code = $LASTEXITCODE
          $out | Write-Host
          (@('### Tracker status (after)', '```') + $out + @('```')) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit $code

      # Saved even when a step failed: the tracker records failures too, and
      # the next run needs them. Only after a successful restore, so a run
      # that never loaded the state can't save an empty one over it.
      - name: Save pipeline state
        if: ${{ always() && steps.restore.outcome == 'success' }}
        uses: ./.github/actions/pipeline-state
        with:
          mode: save

      # Control codes, stages and statuses only — no member names (CLAUDE.md
      # § Control Code Tracker). The intake files themselves are NOT uploaded.
      - name: Upload tracker
        if: ${{ always() && steps.restore.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: control-code-tracker
          path: test-data/control-code-tracker.xlsx
          if-no-files-found: ignore
          retention-days: 30

      # Same PII reasoning as playwright.yml: a failure screenshot can show an
      # authenticated page, so keep the retention window short.
      - name: Upload Playwright HTML report
        if: ${{ !cancelled() && (inputs.upload_intake || inputs.upload_memos || inputs.check_core_claims) }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-op-intake
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 3
