# Playwright Tests (Azure DevOps)
#
# ADO translation of .github/workflows/playwright.yml. Manual trigger only.
#
# CI mode: unlike GitHub, ADO does NOT set a `CI` env var (it sets TF_BUILD).
# playwright.config.ts flips into its CI mode (forbidOnly, retries: 2, workers: 1,
# headless) off `process.env.CI`, so we set CI: true below explicitly — without it
# the run would stay headed / non-CI on the agent.

# ─── Things you must set for your org (no equivalent could be derived) ───────────
# - agentPool  : the self-hosted pool that contains the Windows runner (AVD-BASCL06-0).
#                In GitHub the runner is targeted by the labels [self-hosted, windows];
#                in ADO a self-hosted agent lives in a *pool*, so name that pool here.
# - varGroup   : a variable group holding the secrets/vars this pipeline reads
#                (BASE_URL, NEM_EMAIL, NEM_PASSWORD, NEM_OTP_SECRET, the DB_* values,
#                and optionally LOG_LEVEL). Mark the credential ones as secret.
variables:
  - group: PlaywrightCoreClaims          # <-- REPLACE with your variable group name
  - name: agentPool
    value: 'Default'                     # <-- REPLACE with your self-hosted pool name
  # Force playwright.config.ts into CI mode (headless, forbidOnly, retries).
  - name: CI
    value: 'true'

# Manual trigger only (matches GitHub's workflow_dispatch). No CI/PR auto-runs.
trigger: none
pr: none

# Mirror GitHub's `name: ${{ inputs.project }}` run title.
name: ${{ parameters.project }}

parameters:
  - name: project
    displayName: Project to run (db = Database.spec.ts, no browser)
    type: string
    default: chrome
    values:
      - db
      - chrome
      - all
  - name: grep
    displayName: 'Only run tests whose title matches (Playwright -g). Leave blank to run all.'
    type: string
    default: ' '

jobs:
  - job: test
    displayName: ${{ parameters.project }}
    timeoutInMinutes: 30
    # Self-hosted Windows runner (AVD-BASCL06-0), reached via its pool + an OS demand.
    pool:
      name: $(agentPool)
      demands:
        - Agent.OS -equals Windows_NT

    steps:
      # ADO checks out `self` automatically; this makes it explicit and keeps the
      # clean behaviour the Allure history logic relies on (workspace wiped each run).
      - checkout: self
        displayName: Checkout

      - task: NodeTool@0
        displayName: Setup Node.js
        inputs:
          versionSpec: '20.x'
        # No npm cache here: this repo keeps no committed lockfile, and caching
        # without one fails ("lock file is not found").

      - script: npm install
        displayName: Install dependencies
        # npm install (not npm ci) because there is no package-lock.json to install from.

      # Install only what the selected project needs:
      #  - db      : no browser at all
      #  - firefox / webkit : Playwright-managed engines, must be installed
      #  - msedge / chrome  : branded browsers, use the ones already on the runner
      - powershell: |
          switch ($env:PROJECT) {
            'db'      { Write-Host 'db project uses no browser - skipping browser install.' }
            'chrome'  { Write-Host 'chrome uses the system Google Chrome on the runner - skipping install.' }
            'all'     { npx playwright install firefox webkit }
            default   { npx playwright install $env:PROJECT }
          }
        displayName: Install Playwright browser
        env:
          PROJECT: ${{ parameters.project }}

      # headless is forced on under CI by playwright.config.ts (CI=true above),
      # so nothing extra is required for the browser projects here.
      - powershell: |
          $pwArgs = @()
          if ($env:PROJECT -ne 'all') { $pwArgs += "--project=$env:PROJECT" }
          if ($env:GREP -and $env:GREP.Trim()) { $pwArgs += '-g'; $pwArgs += $env:GREP.Trim() }
          npx playwright test @pwArgs
        displayName: Run Playwright tests
        env:
          PROJECT: ${{ parameters.project }}
          GREP: ${{ parameters.grep }}
          # Left side = env var the config reads (do not rename); right side = your
          # variable-group variable. Secret vars MUST be mapped here explicitly — ADO
          # does not expose secrets to scripts automatically (non-secret vars are).
          BASE_URL: $(BASE_URL)
          VALID_USERNAME_1: $(NEM_EMAIL)
          VALID_PASSWORD_1: $(NEM_PASSWORD)
          VALID_OTP_SECRET_1: $(NEM_OTP_SECRET)
          # DB-backed specs (db project). data_enrichment vars exist; the Membership
          # test also needs MEMBERSHIP_DB_* — add those to the group or it fails at connect.
          DATA_ENRICHMENT_DB_SERVER: $(DATA_ENRICHMENT_DB_SERVER)
          DATA_ENRICHMENT_DB_NAME: $(DATA_ENRICHMENT_DB_NAME)
          DATA_ENRICHMENT_DB_USER: $(DATA_ENRICHMENT_DB_USER)
          DATA_ENRICHMENT_DB_PASSWORD: $(DATA_ENRICHMENT_DB_PASSWORD)
          DATA_ENRICHMENT_DB_PORT: $(DATA_ENRICHMENT_DB_PORT)
          MEMBERSHIP_DB_SERVER: $(MEMBERSHIP_DB_SERVER)
          MEMBERSHIP_DB_NAME: $(MEMBERSHIP_DB_NAME)
          MEMBERSHIP_DB_USER: $(MEMBERSHIP_DB_USER)
          MEMBERSHIP_DB_PASSWORD: $(MEMBERSHIP_DB_PASSWORD)
          MEMBERSHIP_DB_PORT: $(MEMBERSHIP_DB_PORT)
          LOG_LEVEL: $(LOG_LEVEL)

      # Upload the HTML report whether the run passed or failed, so failures are debuggable.
      - task: PublishPipelineArtifact@1
        displayName: Upload Playwright HTML report
        condition: not(canceled())
        inputs:
          targetPath: playwright-report
          artifact: playwright-report-${{ parameters.project }}

      # Build the Allure report with all widgets enabled. Runs on failure too
      # (not(canceled())), so a failed suite still produces a report. Requires the
      # Allure CLI + a JRE on the runner. Needs no committed lockfile and no browser.
      #
      # Trends/history: checkout wipes the workspace each run, so the previous report's
      # history/ is stashed OUTSIDE the repo (under the runner user profile, keyed per
      # project) and copied back into allure-results/ before generating.
      - powershell: |
          if (-not (Test-Path 'allure-results')) {
            Write-Host 'No allure-results produced (no tests ran?) - skipping Allure report.'
            exit 0
          }

          # Persistent, per-project history store that survives checkout's git clean.
          $histStore = Join-Path $env:USERPROFILE "allure-history\PlaywrightTS-CoreClaims\$env:PROJECT"

          # Carry the previous run's history into this run's results (enables trends).
          if (Test-Path "$histStore\*") {
            New-Item -ItemType Directory -Force -Path 'allure-results\history' | Out-Null
            Copy-Item "$histStore\*" 'allure-results\history' -Recurse -Force
          }

          # Environment widget (non-secret metadata only - never credentials).
          @"
          BASE_URL=$env:BASE_URL
          Project=$env:PROJECT
          Branch=$env:GIT_BRANCH
          Commit=$env:GIT_SHA
          OS=Windows (self-hosted AVD-BASCL06-0)
          "@ | Out-File -FilePath 'allure-results\environment.properties' -Encoding ascii

          # Executor widget: names the build and links trend points back to this run.
          @"
          {
            "name": "Azure DevOps",
            "type": "azure",
            "reportName": "Playwright Tests - $env:PROJECT",
            "buildName": "#$env:BUILD_NUMBER $env:PROJECT",
            "buildOrder": $env:BUILD_ORDER,
            "buildUrl": "$env:BUILD_URL",
            "url": "$env:REPO_URL"
          }
          "@ | Out-File -FilePath 'allure-results\executor.json' -Encoding ascii

          # Allure's launcher is a JVM app. The agent service does not reliably inherit a
          # user-level JAVA_HOME (and the current one is corrupted), so resolve a clean JDK
          # here and set JAVA_HOME/PATH for THIS process only, overriding whatever is set.
          $javaHome = $null
          $javaCmd = Get-Command java.exe -ErrorAction SilentlyContinue
          if ($javaCmd) {
            # <jdk>\bin\java.exe -> <jdk>
            $javaHome = Split-Path (Split-Path $javaCmd.Source -Parent) -Parent
          }
          if (-not $javaHome -or -not (Test-Path (Join-Path $javaHome 'bin\java.exe'))) {
            $roots = @(
              (Join-Path $env:ProgramFiles 'Eclipse Adoptium'),
              (Join-Path ${env:ProgramFiles(x86)} 'Eclipse Adoptium'),
              (Join-Path $env:ProgramFiles 'Microsoft'),
              (Join-Path $env:LOCALAPPDATA 'Programs\Eclipse Adoptium')
            )
            foreach ($r in $roots) {
              if ($r -and (Test-Path $r)) {
                $jdk = Get-ChildItem -Path $r -Directory -ErrorAction SilentlyContinue |
                       Where-Object { $_.Name -like 'jdk*' } |
                       Sort-Object Name -Descending | Select-Object -First 1
                if ($jdk) { $javaHome = $jdk.FullName; break }
              }
            }
          }
          if (-not $javaHome -or -not (Test-Path (Join-Path $javaHome 'bin\java.exe'))) {
            throw "Could not locate a JDK. Install Temurin or set JAVA_HOME on the runner."
          }
          $env:JAVA_HOME = $javaHome
          $env:PATH = (Join-Path $javaHome 'bin') + ';' + $env:PATH
          Write-Host "Using JAVA_HOME=$javaHome"

          # Use the pinned allure-commandline (Allure 2) from node_modules, NOT any
          # global `allure` on the runner: that one is Allure 3, whose CLI dropped
          # `--clean` and the positional results dir, so this command fails to parse.
          npx allure generate allure-results --clean -o allure-report

          # Stash this run's freshly generated history for the next run's trends.
          if (Test-Path 'allure-report\history') {
            New-Item -ItemType Directory -Force -Path $histStore | Out-Null
            Copy-Item 'allure-report\history\*' $histStore -Recurse -Force
          }
        displayName: Generate Allure report
        condition: not(canceled())
        env:
          PROJECT: ${{ parameters.project }}
          BASE_URL: $(BASE_URL)
          GIT_BRANCH: $(Build.SourceBranchName)
          GIT_SHA: $(Build.SourceVersion)
          BUILD_NUMBER: $(Build.BuildNumber)
          # buildOrder must be numeric; Build.BuildId is the monotonic integer id.
          BUILD_ORDER: $(Build.BuildId)
          BUILD_URL: $(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)
          REPO_URL: $(Build.Repository.Uri)

      - task: PublishPipelineArtifact@1
        displayName: Upload Allure report
        condition: not(canceled())
        inputs:
          targetPath: allure-report
          artifact: allure-report-${{ parameters.project }}
